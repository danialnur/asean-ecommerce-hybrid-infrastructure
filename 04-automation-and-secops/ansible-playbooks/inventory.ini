# REFERENCE ONLY - never run against a live device. See ../phase5-plan.md.
# Management IPs match the confirmed addressing plan in
# 01-regional-on-premises-network/topologies/asean-network-topology.md.

[core_switches]
my-kl-hq-core ansible_host=10.10.10.2

[access_switches]
ph-mnl-acc ansible_host=10.10.110.2
th-bkk-acc ansible_host=10.10.120.2

[roas_routers]
ph-mnl-roas ansible_host=10.10.110.1
th-bkk-roas ansible_host=10.10.120.1

[wan_edge_routers]
sg-edge-gw ansible_host=10.255.255.2

# Devices carrying the GUEST-CONTAINMENT extended ACL (Phase 3 scope) -
# deliberately excludes sg-edge-gw, which only has the standard
# MGMT-SSH-ONLY ACL (no local GUEST_WIFI VLAN to contain at that site).
[guest_containment_devices]
my-kl-hq-core
ph-mnl-roas
th-bkk-roas

[switches:children]
core_switches
access_switches

[routers:children]
roas_routers
wan_edge_routers

[cisco_ios:children]
switches
routers

[cisco_ios:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
# Never hardcode credentials - same principle as devices.py. All 3 env
# vars must be exported before any real ansible-playbook run.
ansible_user="{{ lookup('env', 'AREHI_SSH_USER') | default('asean.admin', true) }}"
ansible_password="{{ lookup('env', 'AREHI_SSH_PASSWORD') }}"
ansible_become=yes
ansible_become_method=enable
# ansible_password only supplies the SSH login credential - enable-mode
# escalation needs its own password wired up separately, or
# ansible_become=yes silently has nothing to escalate with.
ansible_become_password="{{ lookup('env', 'AREHI_ENABLE_SECRET') }}"
