# GUEST-CONTAINMENT ACL entries for ph-mnl-roas, exactly matching the real
# `ip access-list extended GUEST-CONTAINMENT` block in
# 01-regional-on-premises-network/router-configs/PH-MNL-ROAS.cfg - kept as an explicit,
# auditable list per host rather than generated from a shared template,
# so it can be diffed directly against that .cfg file.
guest_containment_aces:
  - sequence: 10
    grant: deny
    protocol_options:
      ip: true
    source:
      address: 10.10.112.0
      wildcard_bits: 0.0.0.255
    destination:
      address: 10.10.10.0
      wildcard_bits: 0.0.0.255
