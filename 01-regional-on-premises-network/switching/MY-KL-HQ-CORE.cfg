! =============================================================
! Device:      MY-KL-HQ-CORE
! Role:        Malaysia HQ Core / Distribution Switch (3-Tier Core)
! Platform:    Cisco Catalyst 3650-24PS (IOS-XE) - reference config
! Site:        Kuala Lumpur, Malaysia (HQ)
! Certs:       CCNA 200-301 v1.1 - Domains 1.0 (Network Fundamentals),
!              2.0 (Network Access), 3.0 (IP Connectivity)
! =============================================================

! #############################################################
! ############   PHASE 1 - BASIC CONNECTIVITY   ################
! #############################################################

hostname MY-KL-HQ-CORE
!
enable secret P@ssw0rd
!
service password-encryption
no ip domain-lookup
ip domain-name danny-sec.internal
!
username asean.admin privilege 15 secret Adminp@ss
!
! -------------------------------------------------------------
! VLAN DATABASE - Standard NOC VLAN scheme, applied across all
! regional sites (MY / SG / PH / TH) for consistency
! -------------------------------------------------------------
vlan 10
 name MGMT
vlan 20
 name LOGISTICS_SALES
vlan 30
 name GUEST_WIFI
vlan 40
 name DMZ_SERVERS
vlan 99
 name NATIVE
!
! -------------------------------------------------------------
! SVIs - Inter-VLAN routing performed at the Malaysia HQ core
! (Router-on-a-Stick is used instead at Manila/Bangkok, see
! their respective access-switch + WAN router configs). ip routing
! must be enabled globally first - unlike a router, a multilayer
! switch does NOT route between VLANs by default.
! -------------------------------------------------------------
ip routing
!
interface Vlan10
 description MGMT - Core switch / AP / WLC management
 ip address 10.10.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 150
 standby 10 preempt
 no shutdown
!
interface Vlan20
 description LOGISTICS_SALES - Finance & order-fulfilment staff
 ip address 10.10.20.2 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 150
 standby 20 preempt
 no shutdown
!
interface Vlan30
 description GUEST_WIFI - Isolated guest wireless
 ip address 10.10.30.2 255.255.255.0
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 150
 standby 30 preempt
 no shutdown
!
interface Vlan40
 description DMZ_SERVERS - TFTP / SIEM / RADIUS
 ip address 10.10.40.2 255.255.255.0
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 150
 standby 40 preempt
 no shutdown
!
! -------------------------------------------------------------
! SPANNING TREE - Rapid PVST+, MY-KL-HQ-CORE is primary root
! -------------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root primary
spanning-tree portfast bpduguard default
!
! -------------------------------------------------------------
! ETHERCHANNEL - LACP (802.3ad) bundle to distribution/access
! -------------------------------------------------------------
interface range GigabitEthernet1/0/1 - 2
 description Po1 members - link to MY-KL-HQ-DIST
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 description LACP bundle to MY-KL-HQ-DIST
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
!
! -------------------------------------------------------------
! WAN UPLINKS - Routed hub-and-spoke links to the 3 remote sites.
! -------------------------------------------------------------
interface GigabitEthernet1/0/22
 description WAN uplink to TH-BKK-ROAS (OSPF Area 0)
 no switchport
 ip address 10.10.254.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0/23
 description WAN uplink to PH-MNL-ROAS (OSPF Area 0)
 no switchport
 ip address 10.10.254.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0/24
 description WAN uplink to SG-EDGE-GW (OSPF Area 0)
 no switchport
 ip address 10.10.254.1 255.255.255.252
 no shutdown
!
! -------------------------------------------------------------
! ACCESS PORTS - Trunk to WLC + hardened end-user ports
! -------------------------------------------------------------
interface GigabitEthernet1/0/10
 description Trunk to Cisco WLC (AP-manager / dynamic interfaces)
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40
 switchport nonegotiate
 no shutdown
!
interface range GigabitEthernet1/0/11 - 20
 description Access ports - LOGISTICS_SALES staff workstations
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 spanning-tree guard root
 no shutdown
!
! -------------------------------------------------------------
! DISCOVERY PROTOCOLS
! -------------------------------------------------------------
cdp run
lldp run
! Disable CDP/LLDP on the WAN edge-facing ports only
interface range GigabitEthernet1/0/22 - 24
 no cdp enable
 no lldp transmit
 no lldp receive
!
! -------------------------------------------------------------
! MANAGEMENT ACCESS
! -------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
line vty 0 15
 transport input ssh
 login local
!

! #############################################################
! ############   PHASE 2 - DYNAMIC ROUTING & IPV6   ############
! ############   (everything below is new - type this   #######
! ############   after Phase 1 above is already working) #######
! #############################################################

! -------------------------------------------------------------
! IPv6 - enabled globally, then EUI-64 addressing on each VLAN
! SVI (re-entering the same interfaces configured in Phase 1
! above - this just adds to what's already there, nothing from
! Phase 1 needs to be removed or retyped)
! -------------------------------------------------------------
ipv6 unicast-routing
!
interface Vlan10
 ipv6 address 2001:DB8:1:10::/64 eui-64
!
interface Vlan20
 ipv6 address 2001:DB8:1:20::/64 eui-64
!
interface Vlan30
 ipv6 address 2001:DB8:1:30::/64 eui-64
!
interface Vlan40
 ipv6 address 2001:DB8:1:40::/64 eui-64
!
! -------------------------------------------------------------
! LOOPBACK - stable OSPF Router ID, never physically goes down
! -------------------------------------------------------------
interface Loopback0
 ip address 10.255.255.1 255.255.255.255
!
! -------------------------------------------------------------
! WAN UPLINKS - add IPv6 addressing and OSPF DR priority on top
! of the Phase 1 IPv4 config already sitting on these interfaces.
! Priority 255 - guaranteed DR on all three, since MY-KL-HQ-CORE
! is the hub every spoke only ever talks to.
! -------------------------------------------------------------
interface GigabitEthernet1/0/22
 ipv6 address 2001:DB8:FF::4/127
 ip ospf priority 255
!
interface GigabitEthernet1/0/23
 ipv6 address 2001:DB8:FF::2/127
 ip ospf priority 255
!
interface GigabitEthernet1/0/24
 ipv6 address 2001:DB8:FF::0/127
 ip ospf priority 255
!
! -------------------------------------------------------------
! OSPF AREA 0 - Loopback0 above supplies a stable Router ID.
! passive-interface default + no passive-interface on the WAN
! links means every subnet below is still advertised, but only
! the WAN links actually form neighbor adjacencies.
! -------------------------------------------------------------
router ospf 1
 router-id 10.255.255.1
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet1/0/22
 no passive-interface GigabitEthernet1/0/23
 no passive-interface GigabitEthernet1/0/24
 network 10.255.255.1 0.0.0.0 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.30.0 0.0.0.255 area 0
 network 10.10.40.0 0.0.0.255 area 0
 network 10.10.254.0 0.0.0.3 area 0
 network 10.10.254.4 0.0.0.3 area 0
 network 10.10.254.8 0.0.0.3 area 0
!
! -------------------------------------------------------------
! IPv6 CROSS-SITE ROUTING - static, not OSPFv3. OSPFv3 was
! actually configured and live-tested first (matching the IPv4
! design: same router-ids, area 0, per-interface `ipv6 ospf 1
! area 0`), but confirmed via `show ipv6 ospf interface brief`
! on every device that no adjacency ever formed on any link -
! including the simplest possible case, a single directly-
! connected pair with a freshly rebuilt process - despite
! `ipv6 unicast-routing` present and every interface correctly
! registered under area 0. OSPFv2 works perfectly on these same
! physical links, so this is a confirmed Packet Tracer 9.0.0
! OSPFv3 simulation limitation, not a config error. Static
! routes below achieve the same end-to-end IPv6 reachability
! without depending on it - MY-KL-HQ-CORE is the hub, so it only
! needs one summarized route per remote site (each site's 4
! VLANs share one /48), while each spoke (SG-EDGE-GW, PH-MNL-ROAS,
! TH-BKK-ROAS) just needs a single default route back to the hub,
! its only way out. Verified with a real cross-site ping - see
! evidences/README.md.
! -------------------------------------------------------------
ipv6 route 2001:DB8:3::/48 2001:DB8:FF::3
ipv6 route 2001:DB8:4::/48 2001:DB8:FF::5
!

! #############################################################
! ############   PHASE 3 - SECURITY HARDENING & IP SERVICES  ###
! ############   (everything below is new - type this   #######
! ############   after Phase 1+2 above is already working) #####
! #############################################################

! -------------------------------------------------------------
! NTP - Malaysia HQ is the authoritative internal time source
! (no real internet-reachable NTP exists in this lab)
! -------------------------------------------------------------
ntp master 3
!
! -------------------------------------------------------------
! SNMPv3 - authPriv (SHA authentication + AES encryption), traps
! sent to the placeholder core services server
!
! PLATFORM LIMITATION: SNMPv3 (group/user/host/enable traps) is NOT
! supported on this Packet Tracer 9.0.0 device - confirmed via
! 'snmp-server ?' (only 'community' exists, no group/user/host/traps).
! Kept below as real-hardware-accurate (Catalyst/ISR fully support v3);
! the live PT lab instead uses:
!   snmp-server community AREHI-RO-2026 RO
! -------------------------------------------------------------
snmp-server group NETADMINS v3 priv
snmp-server user netmonitor NETADMINS v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server host 10.10.40.10 version 3 priv netmonitor
snmp-server enable traps
!
! -------------------------------------------------------------
! DHCP SNOOPING + DYNAMIC ARP INSPECTION - Layer 2 active defense
! against rogue DHCP servers and ARP poisoning. Access ports stay
! untrusted (the default) - only a trusted uplink would be exempt,
! and this device has no such uplink to a real DHCP server today.
! -------------------------------------------------------------
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40
ip arp inspection vlan 10,20,30,40
ip arp inspection validate src-mac dst-mac ip
!
! -------------------------------------------------------------
! DHCP RELAY - only on VLANs with real end-user devices
! -------------------------------------------------------------
interface Vlan20
 ip helper-address 10.10.40.10
!
interface Vlan30
 ip helper-address 10.10.40.10
!
! -------------------------------------------------------------
! MY-KL-DMZ-SRV UPLINK - added mid-Phase 3 after the first TFTP backup
! attempt genuinely timed out (10.10.40.10 was a placeholder address with
! no real device behind it - see phase3-plan.md's "Server inventory").
! Rather than just documenting the failure, a real Packet Tracer Server
! device was added here instead - see
! ../../02-security-hardening/evidences/README.md's "TFTP Configuration
! Backup" section for the full before/after evidence. Single dedicated
! server, so port security is tightened to maximum 1 rather than the
! maximum 2 used on the shared LOGISTICS_SALES access ports above.
!
! UNVERIFIED: this interface block was written to match what the TFTP
! evidence describes (Gi1/0/21, VLAN 40), but no live capture since then
! (`sh vlan brief`, `sh port-security interface Gi1/0/21`) actually
! confirms the live device has switchport/VLAN/port-security applied to
! match. Recapture and confirm before treating this block as verified.
! -------------------------------------------------------------
interface GigabitEthernet1/0/21
 description Access port - MY-KL-DMZ-SRV (TFTP / Syslog / SNMP trap receiver, 10.10.40.10)
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! -------------------------------------------------------------
! ACLs - see 02-security-hardening/phase3-plan.md for full policy
! rationale. Standard ACL restricts SSH/VTY to MGMT subnets only;
! extended ACL contains GUEST_WIFI away from MGMT/LOGISTICS_SALES/
! DMZ_SERVERS across all three sites (IPv4 + IPv6 versions of both)
! -------------------------------------------------------------
ip access-list standard MGMT-SSH-ONLY
 permit 10.10.10.0 0.0.0.255
 permit 10.10.110.0 0.0.0.255
 permit 10.10.120.0 0.0.0.255
!
ipv6 access-list MGMT-SSH-ONLY-V6
 permit ipv6 2001:DB8:1:10::/64 any
 permit ipv6 2001:DB8:3:10::/64 any
 permit ipv6 2001:DB8:4:10::/64 any
!
ip access-list extended GUEST-CONTAINMENT
 deny ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.110.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.120.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.111.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.121.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.40.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.113.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.123.0 0.0.0.255
 permit ip any any
!
ipv6 access-list GUEST-CONTAINMENT-V6
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:1:10::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:3:10::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:4:10::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:1:20::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:3:20::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:4:20::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:1:40::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:3:40::/64
 deny ipv6 2001:DB8:1:30::/64 2001:DB8:4:40::/64
 permit ipv6 any any
!
interface Vlan30
! PLATFORM LIMITATION: 'ip access-group <name> in' does not persist when
! applied to an SVI (VLAN interface) on this Packet Tracer 9.0.0 device -
! confirmed via isolation test (identical command persists fine on a spare
! physical port, so the bug is specifically scoped to SVIs). Kept below as
! real-hardware-accurate, since this bug doesn't exist on real Catalyst
! hardware. The live PT lab instead applies GUEST-CONTAINMENT as a Port ACL
! on GigabitEthernet1/0/10 (the WLC trunk - the only physical path VLAN 30
! traffic enters this device through). 'ipv6 traffic-filter' below is
! unaffected and works normally on this same SVI.
 ip access-group GUEST-CONTAINMENT in
 ipv6 traffic-filter GUEST-CONTAINMENT-V6 in
!
line vty 0 15
 access-class MGMT-SSH-ONLY in
 ipv6 access-class MGMT-SSH-ONLY-V6 in
!
end
