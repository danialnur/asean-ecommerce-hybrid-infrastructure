! =============================================================
! Device:      PH-MNL-ACC
! Role:        Manila Fulfillment Hub - Access Switch
! Platform:    Cisco Catalyst 2960-24TT (IOS-XE) - reference config
! Site:        Manila, Philippines (Regional Warehouse)
! Phase:       01-regional-on-premises-network
! Certs:       CCNA 200-301 v1.1 - Domains 1.0, 2.0
! Note:        Layer 2 active-defense hardening (Port Security /
!              DHCP Snooping / DAI) is configured inline below, in this
!              same file's Phase 3 section - not a separate file under
!              02-security-hardening/layer2-defense/ (that directory is
!              intentionally empty; see root README.md's repo structure)
! =============================================================

hostname PH-MNL-ACC
!
enable secret P@ssw0rd
!
service password-encryption
no ip domain-lookup
ip domain-name danny-sec.internal
!
username asean.admin privilege 15 secret Adminp@ss
!
! -------------------------------------------------------------
! VLAN DATABASE - matches the standard NOC VLAN scheme
! -------------------------------------------------------------
vlan 10
 name MGMT
vlan 20
 name LOGISTICS_SALES
vlan 30
 name GUEST_WIFI
vlan 40
 name DMZ_SERVERS
vlan 99
 name NATIVE
!
interface Vlan10
 description MGMT - switch management, reachable via MY HQ OSPF
 ip address 10.10.110.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.110.1
!
! -------------------------------------------------------------
! SPANNING TREE - Rapid PVST+, secondary root (MY HQ is primary)
! -------------------------------------------------------------
spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,99 root secondary
! PLATFORM LIMITATION: 'spanning-tree extend system-id' cannot be typed
! on this Packet Tracer 9.0.0 device - confirmed via 'spanning-tree ?'
! (only mode/portfast/vlan listed). Further testing showed it's actually
! a mandatory, always-on feature here (present in a live device's own
! 'show run' despite no way to type it) - not missing, just
! non-configurable. Kept below as real-hardware-accurate; skipped when
! typing into the live PT lab.
spanning-tree extend system-id
spanning-tree portfast bpduguard default
!
! -------------------------------------------------------------
! UPLINK TRUNK - single link to PH-MNL-ROAS (Router-on-a-Stick).
! No EtherChannel - the ISR4321 only has 2 onboard GigabitEthernet
! ports and needs the second one for its WAN link back to MY HQ, so
! this is a single trunk instead of an LACP Po1 bundle. Gi0/1 is
! left free as a spare port. This switch's bulk access ports are
! FastEthernet, not Gigabit - only 2 fixed Gigabit uplink ports exist.
! -------------------------------------------------------------
interface GigabitEthernet0/2
 description Trunk uplink to PH-MNL-ROAS Gi0/0/0
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 no shutdown
!
! -------------------------------------------------------------
! ACCESS PORTS - Barcode scanners / inventory terminals (LOGISTICS_SALES)
! -------------------------------------------------------------
interface range FastEthernet0/1 - 20
 description Access - warehouse barcode scanners & inventory terminals
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 spanning-tree guard root
 no shutdown
!
interface range FastEthernet0/21 - 22
 description Access - GUEST_WIFI AP uplinks (autonomous AP, no WLC at PH)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! -------------------------------------------------------------
! DISCOVERY PROTOCOLS
! -------------------------------------------------------------
cdp run
lldp run
!
! -------------------------------------------------------------
! MANAGEMENT ACCESS
! -------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
line vty 0 15
 transport input ssh
 login local
!

! #############################################################
! ############   PHASE 3 - SECURITY HARDENING & IP SERVICES  ###
! ############   (everything below is new - type this   #######
! ############   after Phase 1 above is already working) #######
! #############################################################

! -------------------------------------------------------------
! NTP - syncs to MY-KL-HQ-CORE's stable loopback, reachable via
! this switch's default-gateway now that OSPF (Phase 2) routes it
! -------------------------------------------------------------
ntp server 10.255.255.1
!
! -------------------------------------------------------------
! SNMPv3 - authPriv, traps to the placeholder core services server
!
! PLATFORM LIMITATION: SNMPv3 (group/user/host/enable traps) is NOT
! supported on this Packet Tracer 9.0.0 device - confirmed via
! 'snmp-server ?' (only 'community' exists). Kept below as
! real-hardware-accurate; the live PT lab instead uses:
!   snmp-server community AREHI-RO-2026 RO
! -------------------------------------------------------------
snmp-server group NETADMINS v3 priv
snmp-server user netmonitor NETADMINS v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server host 10.10.40.10 version 3 priv netmonitor
snmp-server enable traps
!
! -------------------------------------------------------------
! DHCP SNOOPING + DYNAMIC ARP INSPECTION - the uplink trunk to
! PH-MNL-ROAS is trusted (DHCP relay replies and legitimate gateway
! ARP traffic arrive from there); every end-host-facing port stays
! untrusted (the default) - that's where a rogue DHCP server or an
! ARP-poisoning attempt would actually be plugged in.
! -------------------------------------------------------------
ip dhcp snooping
ip dhcp snooping vlan 10,20,30,40
ip arp inspection vlan 10,20,30,40
ip arp inspection validate src-mac dst-mac ip
!
interface GigabitEthernet0/2
 ip dhcp snooping trust
 ip arp inspection trust
!
! -------------------------------------------------------------
! ACL - restrict SSH/VTY to MGMT subnets only. IPv4 only - this
! switch has no IPv6 addressing configured (Phase 2 only added
! IPv6 to the 4 routing devices).
! -------------------------------------------------------------
ip access-list standard MGMT-SSH-ONLY
 permit 10.10.10.0 0.0.0.255
 permit 10.10.110.0 0.0.0.255
 permit 10.10.120.0 0.0.0.255
!
line vty 0 15
 access-class MGMT-SSH-ONLY in
!
end
