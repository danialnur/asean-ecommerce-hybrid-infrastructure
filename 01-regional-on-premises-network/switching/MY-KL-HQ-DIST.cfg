! =============================================================
! Device:      MY-KL-HQ-DIST
! Role:        Malaysia HQ Distribution Switch - LACP EtherChannel peer
!              for MY-KL-HQ-CORE
! Platform:    Cisco Catalyst 3650-24PS (IOS-XE) - reference config
! Site:        Kuala Lumpur, Malaysia (HQ)
! Certs:       CCNA 200-301 v1.1 - Domain 2.0 (Network Access - EtherChannel)
! Note:        Added specifically so MY-KL-HQ-CORE's LACP EtherChannel
!              (Port-channel1, Gi1/0/1-2) had a real peer to negotiate
!              with - that config existed from Phase 1 but was
!              unverified until this device existed. Scoped narrowly to
!              EtherChannel/trunk verification only: this switch isn't
!              part of the Phase 3 security-hardening set (no SSH,
!              port-security, or ACL hardening applied here), since
!              nothing else in this project routes through or depends
!              on it - see asean-network-topology.md's device inventory
!              note.
! =============================================================

hostname MY-KL-HQ-DIST
!
enable secret P@ssw0rd
!
service password-encryption
no ip domain-lookup
ip domain-name danny-sec.internal
!
username asean.admin privilege 15 secret Adminp@ss
!
! -------------------------------------------------------------
! VLAN DATABASE - matches MY-KL-HQ-CORE's scheme exactly, so the trunk/
! LACP link between them carries consistent VLANs on both ends.
! Verified via `show vlan brief` rather than `show running-config` -
! this platform didn't echo the vlan/name blocks back as running-config
! text the way MY-KL-HQ-CORE's does, so the database was confirmed
! directly instead of assumed from running-config output alone.
! -------------------------------------------------------------
vlan 10
 name MGMT
vlan 20
 name LOGISTICS_SALES
vlan 30
 name GUEST_WIFI
vlan 40
 name DMZ_SERVERS
vlan 99
 name NATIVE
!
! -------------------------------------------------------------
! LACP EtherChannel to MY-KL-HQ-CORE (Gi1/0/1-2 <-> Gi1/0/1-2).
! Verified live, not assumed: the first negotiation attempt left both
! member ports stand-alone (`show etherchannel summary` flag I, not P)
! despite byte-for-byte matching config on both ends - confirmed not a
! config error by temporarily testing static `channel-group 1 mode on`
! (which bundled immediately). Removing and re-adding channel-group
! membership on both switches (`no channel-group 1` / `no channel-
! protocol lacp` / re-add) reset the LACP state machine and brought the
! bundle up cleanly under real LACP (Po1(SU), both ports (P)) - see
! 01-regional-on-premises-network/evidences/README.md for the
! verification screenshots.
! -------------------------------------------------------------
interface range GigabitEthernet1/0/1 - 2
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 channel-protocol lacp
 channel-group 1 mode active
 no shutdown
!
interface Port-channel1
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
!
end
