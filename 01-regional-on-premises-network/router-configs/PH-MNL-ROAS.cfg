! =============================================================
! Device:      PH-MNL-ROAS
! Role:        Manila Fulfillment Hub - Router-on-a-Stick
! Platform:    Cisco ISR 4321 (IOS-XE) - reference config
! Site:        Manila, Philippines (Regional Warehouse)
! Certs:       CCNA 200-301 v1.1 - Domains 1.0, 3.0
! Note:        Performs inter-VLAN routing for PH-MNL-ACC via 802.1Q
!              sub-interfaces on a single trunk link (Gi0/0/0). The
!              ISR4321 only has 2 onboard GigabitEthernet ports, so
!              LACP EtherChannel to the switch isn't used here - Gi0/0/1
!              is needed for the WAN link back to MY HQ instead.
!              DHCP relay / NAT / ACLs are added in Phase 3
!              (02-security-hardening/).
! =============================================================

! #############################################################
! ############   PHASE 1 - BASIC CONNECTIVITY   ################
! #############################################################

hostname PH-MNL-ROAS
!
enable secret P@ssw0rd
!
service password-encryption
no ip domain-lookup
ip domain-name danny-sec.internal
!
username asean.admin privilege 15 secret Adminp@ss
!
! -------------------------------------------------------------
! LAN TRUNK - single link to PH-MNL-ACC (no EtherChannel - see note
! at top of file). Sub-interfaces below, one per VLAN, native VLAN 99
! matches the switch trunk config (switchport trunk native vlan 99)
! -------------------------------------------------------------
interface GigabitEthernet0/0/0
 description Trunk to PH-MNL-ACC - ROAS sub-interfaces below
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description MGMT
 encapsulation dot1Q 10
 ip address 10.10.110.1 255.255.255.0
!
interface GigabitEthernet0/0/0.20
 description LOGISTICS_SALES - warehouse/barcode/inventory subnet
 encapsulation dot1Q 20
 ip address 10.10.111.1 255.255.255.0
!
interface GigabitEthernet0/0/0.30
 description GUEST_WIFI
 encapsulation dot1Q 30
 ip address 10.10.112.1 255.255.255.0
!
interface GigabitEthernet0/0/0.40
 description DMZ_SERVERS
 encapsulation dot1Q 40
 ip address 10.10.113.1 255.255.255.0
!
interface GigabitEthernet0/0/0.99
 description NATIVE - untagged, no routed IP
 encapsulation dot1Q 99 native
!
! -------------------------------------------------------------
! WAN LINK - Routed link back to MY-KL-HQ-CORE. Static default
! route is a Phase 1 stopgap - Phase 2 replaces it with OSPF.
! -------------------------------------------------------------
interface GigabitEthernet0/0/1
 description WAN link to MY-KL-HQ-CORE Gi1/0/23 (OSPF Area 0)
 ip address 10.10.254.6 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.10.254.5
!
! -------------------------------------------------------------
! DISCOVERY PROTOCOLS - disabled on the WAN-facing interface only
! -------------------------------------------------------------
cdp run
lldp run
interface GigabitEthernet0/0/1
 no cdp enable
 no lldp transmit
 no lldp receive
!
! -------------------------------------------------------------
! MANAGEMENT ACCESS
! -------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
line vty 0 15
 transport input ssh
 login local
!

! #############################################################
! ############   PHASE 2 - DYNAMIC ROUTING & IPV6   ############
! ############   (everything below is new - type this   #######
! ############   after Phase 1 above is already working) #######
! #############################################################

ipv6 unicast-routing
!
! -------------------------------------------------------------
! LAN SUB-INTERFACES - add IPv6 (EUI-64) addressing on top of the
! Phase 1 IPv4 config already sitting on each of these
! -------------------------------------------------------------
interface GigabitEthernet0/0/0.10
 ipv6 address 2001:DB8:3:10::/64 eui-64
!
interface GigabitEthernet0/0/0.20
 ipv6 address 2001:DB8:3:20::/64 eui-64
!
interface GigabitEthernet0/0/0.30
 ipv6 address 2001:DB8:3:30::/64 eui-64
!
interface GigabitEthernet0/0/0.40
 ipv6 address 2001:DB8:3:40::/64 eui-64
!
! -------------------------------------------------------------
! LOOPBACK - stable OSPF Router ID, never physically goes down
! -------------------------------------------------------------
interface Loopback0
 ip address 10.255.255.3 255.255.255.255
!
! -------------------------------------------------------------
! WAN LINK - add IPv6 addressing and OSPF DR priority on top of
! the Phase 1 IPv4 config already there. Priority 0 - never needs
! to be DR/BDR on this link.
! -------------------------------------------------------------
interface GigabitEthernet0/0/1
 ipv6 address 2001:DB8:FF::3/127
 ip ospf priority 0
!
! -------------------------------------------------------------
! OSPF AREA 0 - once this is working, the Phase 1 static default
! route above is no longer needed for internal reachability
! -------------------------------------------------------------
router ospf 1
 router-id 10.255.255.3
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 network 10.255.255.3 0.0.0.0 area 0
 network 10.10.110.0 0.0.0.255 area 0
 network 10.10.111.0 0.0.0.255 area 0
 network 10.10.112.0 0.0.0.255 area 0
 network 10.10.113.0 0.0.0.255 area 0
 network 10.10.254.4 0.0.0.3 area 0
!
! -------------------------------------------------------------
! IPv6 CROSS-SITE ROUTING - static, not OSPFv3. See the matching
! comment in switching/MY-KL-HQ-CORE.cfg for the full story:
! OSPFv3 was configured and live-tested first, confirmed via
! `show ipv6 ospf interface brief` to never form an adjacency on
! any link despite fully correct config - a confirmed Packet
! Tracer 9.0.0 limitation, not a config error. PH-MNL-ROAS has
! only one way out (toward MY-KL-HQ-CORE), so a single default
! route covers every remote destination - same pattern as the
! Phase 1 static IPv4 default route referenced above, before
! OSPFv2 replaced it.
! -------------------------------------------------------------
ipv6 route ::/0 2001:DB8:FF::2
!
! Once OSPF neighbors come up and "show ip route ospf" shows the
! other sites' subnets, remove the Phase 1 stopgap:
no ip route 0.0.0.0 0.0.0.0 10.10.254.5
!

! #############################################################
! ############   PHASE 3 - SECURITY HARDENING & IP SERVICES  ###
! ############   (everything below is new - type this   #######
! ############   after Phase 1+2 above is already working) #####
! #############################################################

! -------------------------------------------------------------
! NTP - syncs to MY-KL-HQ-CORE's stable loopback
! -------------------------------------------------------------
ntp server 10.255.255.1
!
! -------------------------------------------------------------
! SNMPv3 - authPriv, traps to the placeholder core services server
!
! PLATFORM LIMITATION: SNMPv3 (group/user/host/enable traps) is NOT
! supported on this Packet Tracer 9.0.0 device - confirmed via
! 'snmp-server ?' (only 'community' exists). Kept below as
! real-hardware-accurate; the live PT lab instead uses:
!   snmp-server community AREHI-RO-2026 RO
! -------------------------------------------------------------
snmp-server group NETADMINS v3 priv
snmp-server user netmonitor NETADMINS v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server host 10.10.40.10 version 3 priv netmonitor
snmp-server enable traps
!
! -------------------------------------------------------------
! DHCP RELAY - only on sub-interfaces with real end-user devices
! -------------------------------------------------------------
interface GigabitEthernet0/0/0.20
 ip helper-address 10.10.40.10
!
interface GigabitEthernet0/0/0.30
 ip helper-address 10.10.40.10
!
! -------------------------------------------------------------
! ACLs - see 02-security-hardening/phase3-plan.md. Standard ACL
! restricts SSH/VTY to MGMT subnets only; extended ACL contains
! this site's GUEST_WIFI away from MGMT/LOGISTICS_SALES/DMZ_SERVERS
! across all three sites (IPv4 + IPv6)
! -------------------------------------------------------------
ip access-list standard MGMT-SSH-ONLY
 permit 10.10.10.0 0.0.0.255
 permit 10.10.110.0 0.0.0.255
 permit 10.10.120.0 0.0.0.255
!
ipv6 access-list MGMT-SSH-ONLY-V6
 permit ipv6 2001:DB8:1:10::/64 any
 permit ipv6 2001:DB8:3:10::/64 any
 permit ipv6 2001:DB8:4:10::/64 any
!
ip access-list extended GUEST-CONTAINMENT
 deny ip 10.10.112.0 0.0.0.255 10.10.10.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.110.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.120.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.20.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.111.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.121.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.40.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.113.0 0.0.0.255
 deny ip 10.10.112.0 0.0.0.255 10.10.123.0 0.0.0.255
 permit ip any any
!
ipv6 access-list GUEST-CONTAINMENT-V6
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:1:10::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:3:10::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:4:10::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:1:20::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:3:20::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:4:20::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:1:40::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:3:40::/64
 deny ipv6 2001:DB8:3:30::/64 2001:DB8:4:40::/64
 permit ipv6 any any
!
interface GigabitEthernet0/0/0.30
 ip access-group GUEST-CONTAINMENT in
 ipv6 traffic-filter GUEST-CONTAINMENT-V6 in
!
line vty 0 15
 access-class MGMT-SSH-ONLY in
 ipv6 access-class MGMT-SSH-ONLY-V6 in
!
end
