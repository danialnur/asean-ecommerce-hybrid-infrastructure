! =============================================================
! Device:      SG-EDGE-GW
! Role:        Singapore WAN Edge Gateway / Cloud On-Ramp
! Platform:    Cisco ISR 4331 (IOS-XE) - reference config
! Site:        Singapore (Cloud Edge & Direct Connect toward AWS ap-southeast-1)
! Certs:       CCNA 200-301 v1.1 - Domains 1.0, 3.0
! Note:        This site has no local VLANs/warehouse - it exists purely
!              to terminate the WAN link from Malaysia HQ and hand off
!              to AWS. The actual IPsec Site-to-Site VPN tunnel (IKEv2,
!              AES-256) to the AWS Virtual Private Gateway is configured
!              in 03-aws-cloud-infrastructure/vpn-gateway/ (Phase 4).
! =============================================================

! #############################################################
! ############   PHASE 1 - BASIC CONNECTIVITY   ################
! #############################################################

hostname SG-EDGE-GW
!
enable secret P@ssw0rd
!
service password-encryption
no ip domain-lookup
ip domain-name danny-sec.internal
!
username asean.admin privilege 15 secret Adminp@ss
!
! -------------------------------------------------------------
! WAN LINK - Routed link back to MY-KL-HQ-CORE (OSPF Area 0)
! -------------------------------------------------------------
interface GigabitEthernet0/0/0
 description WAN link to MY-KL-HQ-CORE Gi1/0/24 (OSPF Area 0)
 ip address 10.10.254.2 255.255.255.252
 no shutdown
!
! -------------------------------------------------------------
! CLOUD-FACING INTERFACE - ISP/public interface, becomes the IPsec
! Site-to-Site VPN tunnel source toward the AWS VGW/TGW in Phase 4.
! Address below is a documentation placeholder (RFC 5737 TEST-NET-3).
! -------------------------------------------------------------
interface GigabitEthernet0/0/1
 description Public ISP uplink - IPsec S2S VPN source toward AWS VGW (Phase 4)
 ip address 203.0.113.2 255.255.255.248
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! -------------------------------------------------------------
! DISCOVERY PROTOCOLS - disabled on both WAN-facing interfaces
! -------------------------------------------------------------
cdp run
lldp run
interface range GigabitEthernet0/0/0 - 1
 no cdp enable
 no lldp transmit
 no lldp receive
!
! -------------------------------------------------------------
! MANAGEMENT ACCESS
! -------------------------------------------------------------
crypto key generate rsa general-keys modulus 2048
ip ssh version 2
line vty 0 15
 transport input ssh
 login local
!

! #############################################################
! ############   PHASE 2 - DYNAMIC ROUTING & IPV6   ############
! ############   (everything below is new - type this   #######
! ############   after Phase 1 above is already working) #######
! #############################################################

ipv6 unicast-routing
!
! -------------------------------------------------------------
! LOOPBACK - stable OSPF Router ID, never physically goes down
! -------------------------------------------------------------
interface Loopback0
 ip address 10.255.255.2 255.255.255.255
!
! -------------------------------------------------------------
! WAN LINK - add IPv6 addressing and OSPF DR priority on top of
! the Phase 1 IPv4 config already sitting on this interface.
! Priority 0 - this router never needs to be DR/BDR, it only ever
! talks to MY-KL-HQ-CORE on this link. The cloud-facing interface
! (Gi0/0/1) deliberately gets no IPv6/OSPF at all - matches real
! practice, you'd never run an internal IGP toward a public/ISP
! interface.
! -------------------------------------------------------------
interface GigabitEthernet0/0/0
 ipv6 address 2001:DB8:FF::1/127
 ip ospf priority 0
!
! -------------------------------------------------------------
! OSPF AREA 0
! -------------------------------------------------------------
router ospf 1
 router-id 10.255.255.2
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 network 10.255.255.2 0.0.0.0 area 0
 network 10.10.254.0 0.0.0.3 area 0
!
! -------------------------------------------------------------
! IPv6 CROSS-SITE ROUTING - static, not OSPFv3. See the matching
! comment in switching/MY-KL-HQ-CORE.cfg for the full story:
! OSPFv3 was configured and live-tested first, confirmed via
! `show ipv6 ospf interface brief` to never form an adjacency on
! any link despite fully correct config - a confirmed Packet
! Tracer 9.0.0 limitation, not a config error. SG-EDGE-GW has
! only one way out (toward MY-KL-HQ-CORE), so a single default
! route covers every remote destination.
! -------------------------------------------------------------
ipv6 route ::/0 2001:DB8:FF::0
!

! #############################################################
! ############   PHASE 3 - SECURITY HARDENING & IP SERVICES  ###
! ############   (everything below is new - type this   #######
! ############   after Phase 1+2 above is already working) #####
! #############################################################

! -------------------------------------------------------------
! NTP - syncs to MY-KL-HQ-CORE's stable loopback
! -------------------------------------------------------------
ntp server 10.255.255.1
!
! -------------------------------------------------------------
! SNMPv3 - authPriv, traps to the placeholder core services server
!
! PLATFORM LIMITATION: SNMPv3 (group/user/host/enable traps) is NOT
! supported on this Packet Tracer 9.0.0 device - confirmed via
! 'snmp-server ?' (only 'community' exists). Kept below as
! real-hardware-accurate; the live PT lab instead uses:
!   snmp-server community AREHI-RO-2026 RO
! -------------------------------------------------------------
snmp-server group NETADMINS v3 priv
snmp-server user netmonitor NETADMINS v3 auth sha AuthPass123 priv aes 128 PrivPass123
snmp-server host 10.10.40.10 version 3 priv netmonitor
snmp-server enable traps
!
! -------------------------------------------------------------
! NAT - Gi0/0/0 (toward MY HQ / the internal 10.10.0.0/16 world)
! is inside; Gi0/0/1 (toward the ISP/AWS placeholder) is outside.
! Dynamic PAT overload covers general internal-to-internet traffic;
! static NAT publishes the DMZ core services server behind a fixed
! public-facing address.
! -------------------------------------------------------------
interface GigabitEthernet0/0/0
 ip nat inside
!
interface GigabitEthernet0/0/1
 ip nat outside
 ip access-group WAN-EDGE-INBOUND in
!
ip access-list standard NAT-INSIDE-HOSTS
 permit 10.10.0.0 0.0.255.255
!
ip nat inside source list NAT-INSIDE-HOSTS interface GigabitEthernet0/0/1 overload
ip nat inside source static 10.10.40.10 203.0.113.3
!
! -------------------------------------------------------------
! Inbound filtering on the public ISP interface (Gi0/0/1). The static
! NAT above exists to demonstrate the CCNA static-NAT objective, but
! none of DMZ_SERVERS' actual services (TFTP/RADIUS/Syslog/SNMP-trap,
! per phase3-plan.md) have any legitimate reason to be reachable FROM
! the internet - they're internal admin-plane services only. Without
! this ACL, the static NAT above would leave TFTP and RADIUS exposed
! unfiltered to 0.0.0.0/0. IKE (500/4500) and ESP are explicitly
! permitted first since this interface is also the Site-to-Site IPsec
! VPN source toward the AWS VGW (Phase 4) - numeric port/protocol
! values used instead of the `isakmp`/`esp` keywords since Packet
! Tracer 9.0.0's simulated IOS ACL parser support for those specific
! keywords hasn't been confirmed (unlike the rest of this project's
! platform-limitation notes, this one is NOT independently verified -
! check it against real Packet Tracer behavior before treating it as
! working).
! -------------------------------------------------------------
ip access-list extended WAN-EDGE-INBOUND
 permit udp any host 203.0.113.2 eq 500
 permit udp any host 203.0.113.2 eq 4500
 permit 50 any host 203.0.113.2
 deny ip any host 203.0.113.3
 permit ip any any
!
! -------------------------------------------------------------
! ACL - restrict SSH/VTY to MGMT subnets only (IPv4 + IPv6).
! No GUEST_WIFI containment ACL here - this site has no local
! VLANs at all, so there's no guest traffic to contain.
! -------------------------------------------------------------
ip access-list standard MGMT-SSH-ONLY
 permit 10.10.10.0 0.0.0.255
 permit 10.10.110.0 0.0.0.255
 permit 10.10.120.0 0.0.0.255
!
ipv6 access-list MGMT-SSH-ONLY-V6
 permit ipv6 2001:DB8:1:10::/64 any
 permit ipv6 2001:DB8:3:10::/64 any
 permit ipv6 2001:DB8:4:10::/64 any
!
line vty 0 15
 access-class MGMT-SSH-ONLY in
 ipv6 access-class MGMT-SSH-ONLY-V6 in
!
end
